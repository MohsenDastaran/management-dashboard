<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Capacity">
  <defs>
    <linearGradient id="bg" x1="6" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Occupancy grid: four rooms at different fill levels -->
  <rect x="6" y="6" width="9" height="9" rx="2" fill="#ecfdf5"/>
  <rect x="17" y="6" width="9" height="9" rx="2" fill="#ecfdf5" fill-opacity="0.55"/>
  <rect x="6" y="17" width="9" height="9" rx="2" fill="#ecfdf5" fill-opacity="0.78"/>
  <rect x="17" y="17" width="9" height="9" rx="2" fill="#ecfdf5" fill-opacity="0.32"/>
</svg>
